name: Release

# Tag-driven: `git tag v0.3.0 && git push --tags` is the whole publishing ritual.
# The tag is the source of truth for the version, and the job refuses to run if
# it disagrees with package.json — a release whose contents announce a different
# version than its tag is the kind of thing nobody notices until an update loop
# starts reinstalling the same build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Confirm the tag and the manifest agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MANIFEST=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag v$TAG does not match package.json version $MANIFEST." >&2
            exit 1
          fi
          echo "VERSION=$MANIFEST" >> "$GITHUB_ENV"

      - name: Read the version for a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Nothing ships that does not typecheck and pass its tests. The payload is
      # the artifact users auto-update to, so this is the last gate before it is
      # on other people's machines.
      - run: npm run typecheck
      - run: npm test

      - name: Build the payload
        run: sh scripts/build-payload.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --title "curlapi $VERSION" \
            --generate-notes \
            $(case "$VERSION" in *-*) echo --prerelease ;; esac) \
            "dist/curlapi-$VERSION-app.tar.gz" \
            "dist/curlapi-$VERSION-app.zip" \
            "dist/SHA256SUMS"
